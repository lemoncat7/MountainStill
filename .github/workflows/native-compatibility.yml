name: Native v19 to v20 representative ARM compatibility

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-v19-v20-arm-compatibility
  cancel-in-progress: false

jobs:
  representative-compatibility:
    if: github.repository == 'lemoncat7/MountainStill' && github.event.repository.private == false
    timeout-minutes: 15
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/lemoncat7/MountainStill.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Offline fixed-version and external-journal contracts
        run: |
          python3 source/tests/native_package_driver_test.py
          python3 source/tests/native_process_metrics_test.py
          python3 source/tests/native_package_stability_test.py
          python3 source/tests/native_compat_session_test.py
          python3 source/tests/native_compatibility_test.py
      - name: Two representative cases with actual old and current binaries
        run: python3 source/tools/native_compatibility.py
