name: Native v19 to v20 representative compatibility

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Remaining Windows/Intel representative cases; ARM is a separate existing profile'
        required: true
        type: choice
        default: windows-intel
        options:
          - windows-intel
          - arm

permissions: {}

concurrency:
  group: native-v19-v20-arm-compatibility
  cancel-in-progress: false

jobs:
  representative-compatibility:
    if: github.repository == 'lemoncat7/MountainStill' && github.event.repository.private == false
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.target == 'arm' && fromJSON('[{"runner":"macos-15","python":"python3"}]') || fromJSON('[{"runner":"windows-2025","python":"python"},{"runner":"macos-15-intel","python":"python3"}]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/lemoncat7/MountainStill.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Offline fixed-version and external-journal contracts
        run: |
          ${{ matrix.python }} source/tests/native_package_driver_test.py
          ${{ matrix.python }} source/tests/native_process_metrics_test.py
          ${{ matrix.python }} source/tests/native_package_stability_test.py
          ${{ matrix.python }} source/tests/native_compat_session_test.py
          ${{ matrix.python }} source/tests/native_compatibility_test.py
      - name: Two representative cases with actual old and current binaries
        run: ${{ matrix.python }} source/tools/native_compatibility.py
