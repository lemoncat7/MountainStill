name: Native GUI capability probe

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Retry only Windows after a probe-only fix; default keeps all three OS
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: native-gui-capability-probe
  cancel-in-progress: false

jobs:
  native-gui:
    if: github.repository == 'lemoncat7/MountainStill' && github.event.repository.private == false
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.windows_only && fromJSON('[{"runner":"windows-2025","python":"python"}]') || fromJSON('[{"runner":"windows-2025","python":"python"},{"runner":"macos-15","python":"python3"},{"runner":"macos-15-intel","python":"python3"}]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/lemoncat7/MountainStill.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Validate package driver safety contracts
        run: ${{ matrix.python }} source/tests/native_gui_driver_test.py
      - name: Observe pinned v20 native window geometry (not formal acceptance)
        run: ${{ matrix.python }} source/tools/native_gui_probe.py
