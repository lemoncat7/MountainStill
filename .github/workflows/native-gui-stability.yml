name: Native v20 ARM GUI lifecycle observation

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-v20-arm-gui-lifecycle
  cancel-in-progress: false

jobs:
  native-gui-lifecycle:
    if: github.repository == 'lemoncat7/MountainStill' && github.event.repository.private == false
    timeout-minutes: 30
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/lemoncat7/MountainStill.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Offline safety and GUI lifecycle contracts
        run: |
          python3 source/tests/native_package_driver_test.py
          python3 source/tests/native_process_metrics_test.py
          python3 source/tests/native_package_stability_test.py
          python3 source/tests/native_gui_stability_session_test.py
          python3 source/tests/native_gui_stability_test.py
      - name: Actual GUI wall-clock observation and native Quit
        run: python3 source/tools/native_gui_stability.py
